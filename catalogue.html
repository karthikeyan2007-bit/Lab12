<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue — Dog-Ear Books</title>
  <meta name="description" content="Browse every book at Dog-Ear Books, loaded from an XML catalogue.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236D28D9'/%3E%3Cpath d='M21 0h2a9 9 0 0 1 9 9v2z' fill='%23C4B5FD'/%3E%3Cpath d='M9 9h9a3 3 0 0 1 3 3v11H12a3 3 0 0 1-3-3z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalogue">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header id="site-header"></header>

  <main id="main-content" class="container">
    <div class="page-head">
      <h1>The catalogue</h1>
      <p>Every book here is read live from <code>data/books.xml</code> with <code>fetch()</code> and <code>DOMParser</code>.</p>
    </div>

    <div class="toolbar">
      <div class="toolbar-row">
        <form class="search-pill" id="catalogue-search-form" role="search">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <label class="sr-only" for="catalogue-search">Search books</label>
          <input id="catalogue-search" type="search" placeholder="Search a title, author or topic…" autocomplete="off">
        </form>
        <label class="sr-only" for="catalogue-sort">Sort books</label>
        <select class="select" id="catalogue-sort">
          <option value="featured">Staff favourites first</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="rating">Highest rated</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>
      <div class="chip-row" id="category-filters" role="group" aria-label="Filter by shelf"></div>
    </div>

    <p class="result-line" id="catalogue-count" aria-live="polite">Loading books…</p>
    <div class="book-grid" id="spinner-grid"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/app.js"></script>
</body>
</html>
