<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Dog-Ear Books</title>
  <meta name="description" content="Create a Dog-Ear Books account.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236D28D9'/%3E%3Cpath d='M21 0h2a9 9 0 0 1 9 9v2z' fill='%23C4B5FD'/%3E%3Cpath d='M9 9h9a3 3 0 0 1 3 3v11H12a3 3 0 0 1-3-3z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header id="site-header"></header>

  <main id="main-content" class="auth-wrap">
    <div class="auth-card wide">
      <div class="auth-head">
        <div class="auth-icon" style="--tint: var(--peach);">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        </div>
        <h1>Create your account</h1>
        <p>We keep your details in this browser and store your password only as a SHA-256 hash.</p>
      </div>

      <div class="alert alert-error" id="register-alert" role="alert" hidden></div>

      <form id="register-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="fullname">Full name</label>
            <input class="input" id="fullname" name="fullname" type="text" autocomplete="name" placeholder="Asha Raman" aria-describedby="fullname-error" required>
            <span class="field-error" id="fullname-error"></span>
          </div>
          <div class="field">
            <label for="phone">Mobile number</label>
            <input class="input" id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10 digits, e.g. 9876543210" maxlength="11" aria-describedby="phone-error" required>
            <span class="field-error" id="phone-error"></span>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-error" required>
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" aria-describedby="strength-label password-error" required>
              <button class="pw-toggle-btn" type="button" data-for="password" aria-label="Show password"></button>
            </div>
            <div class="meter" aria-hidden="true"><div class="meter-fill" id="strength-bar"></div></div>
            <span class="field-hint" id="strength-label">Use 8+ characters with upper and lower case letters and a number.</span>
            <span class="field-error" id="password-error"></span>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <div class="pw-wrap">
              <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Type it again" aria-describedby="confirm-error" required>
              <button class="pw-toggle-btn" type="button" data-for="confirm" aria-label="Show password"></button>
            </div>
            <span class="field-error" id="confirm-error"></span>
          </div>
        </div>

        <div class="field">
          <label for="address">Delivery address</label>
          <textarea class="input" id="address" name="address" rows="2" autocomplete="street-address" placeholder="House / flat, street, area, city" aria-describedby="address-error" required></textarea>
          <span class="field-error" id="address-error"></span>
        </div>

        <div class="field">
          <label class="check" for="terms">
            <input type="checkbox" id="terms" aria-describedby="terms-error">
            <span>I agree to the store's terms of sale and returns policy.</span>
          </label>
          <span class="field-error" id="terms-error"></span>
        </div>

        <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/app.js"></script>
</body>
</html>
