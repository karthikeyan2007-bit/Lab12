<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Dog-Ear Books</title>
  <meta name="description" content="Log in to your Dog-Ear Books account.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236D28D9'/%3E%3Cpath d='M21 0h2a9 9 0 0 1 9 9v2z' fill='%23C4B5FD'/%3E%3Cpath d='M9 9h9a3 3 0 0 1 3 3v11H12a3 3 0 0 1-3-3z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header id="site-header"></header>

  <main id="main-content" class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-icon" style="--tint: var(--sky);">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <h1>Welcome back</h1>
        <p>Log in to check out and see your delivery details.</p>
      </div>

      <div class="alert alert-info" id="checkout-required-note" hidden>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Log in to finish your order. Your cart is saved.</span>
      </div>

      <div class="alert" id="login-alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-error" required>
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" aria-describedby="password-error" required>
            <button class="pw-toggle-btn" type="button" data-for="password" aria-label="Show password"></button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
      </form>

      <p class="auth-foot">New here? <a href="register.html">Create an account</a></p>

      <div class="demo-box">
        <strong>Demo account</strong> (from <code>data/users.xml</code>)<br>
        Email: <code>demo@dogear.test</code> &middot; Password: <code>Demo@123</code>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/app.js"></script>
</body>
</html>
